<div class="login-container">
  <div class="login-card">
    <h1>Login</h1>
    <p class="subtitle">E-commerce do Fabrício</p>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          placeholder="seu@email.com"
          required
          [disabled]="loading"
        />
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <input
          type="password"
          id="password"
          [(ngModel)]="password"
          name="password"
          placeholder="••••••••"
          required
          [disabled]="loading"
        />
      </div>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn-primary" [disabled]="loading">
        {{ loading ? "Aguarde..." : "Entrar" }}
      </button>

      <button
        type="button"
        class="btn-secondary"
        (click)="onClickCreateNewAccount()"
        [disabled]="loading"
      >
        Criar nova conta
      </button>
    </form>
  </div>
</div>
